name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python 버전은 .python-version(3.15)에서 읽어 uv가 설치한다.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # TypeSafeClient는 테스트에서 가짜로 대체되므로 API 키가 필요 없다.
      - name: Run tests
        run: uv run pytest -q
