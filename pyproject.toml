[project]
name = "code-router"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "animasana", email = "animagig@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "python-dotenv>=1.2.4",
    "typesafe-sdk>=0.7.5",
]

[project.scripts]
code-router = "code_router:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
